<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  .card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 10% 6%, rgba(255,46,147,.38), transparent 32%),
      radial-gradient(circle at 92% 14%, rgba(0,214,195,.34), transparent 34%),
      radial-gradient(circle at 16% 96%, rgba(122,46,255,.34), transparent 40%),
      radial-gradient(circle at 88% 90%, rgba(255,122,0,.30), transparent 36%),
      #1B0B2E;
    display:flex;align-items:center;gap:52px;
    padding:0 72px;font-family:'Space Grotesk',system-ui,sans-serif;
  }
  .icon{width:330px;height:330px;flex:0 0 auto;filter:drop-shadow(0 24px 60px rgba(0,0,0,.45))}
  .icon img{width:100%;height:100%;display:block;border-radius:76px}
  .txt{flex:1 1 auto;min-width:0}
  .wordmark{
    font-family:'Archivo Black',sans-serif;font-weight:400;
    font-size:92px;line-height:.92;letter-spacing:-3px;
    background:linear-gradient(92deg,#FF2E93,#FF7A00 35%,#7A2EFF 70%,#00D6C3);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .tagline{margin-top:26px;color:#FFF3E4;font-size:38px;font-weight:500;line-height:1.24;max-width:640px}
  .tagline b{font-weight:700}
  .badge{
    display:inline-block;margin-top:34px;padding:14px 26px;border-radius:999px;
    background:#E8FF2E;color:#1B0B2E;font-weight:700;font-size:23px;letter-spacing:.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><img src="file:///Users/binhjo/Documents/Claude%20Cowork/Personal/Pourcast/pourcast/icons/icon-512.png" alt=""></div>
    <div class="txt">
      <div class="wordmark">POURCAST</div>
      <div class="tagline">A live brew timer that <b>paces every pour</b>, with or without a scale.</div>
      <div class="badge">FREE · WORKS OFFLINE · NO SCALE NEEDED</div>
    </div>
  </div>
</body>
</html>
